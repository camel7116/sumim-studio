<!doctype html><html lang="ko"><head><meta charset="utf-8">
<meta name="viewport" content="width=390, initial-scale=1">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;700&display=swap">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{width:390px;height:844px;overflow:hidden;background:#0b0d15;color:#f2f4fa;
 font-family:"IBM Plex Sans KR",sans-serif;position:relative}
.aurora{position:absolute;inset:0;background:
 radial-gradient(300px 260px at 85% 12%, rgba(99,56,238,.55), transparent 70%),
 radial-gradient(340px 300px at 8% 38%, rgba(38,196,183,.32), transparent 70%),
 radial-gradient(300px 320px at 70% 92%, rgba(99,56,238,.35), transparent 72%)}
.wrap{position:relative;padding:22px 24px;height:100%}
.nav{display:flex;justify-content:space-between;align-items:center}
.logo{font-weight:700;font-size:17px;letter-spacing:.22em}
.logo b{color:#8f6bff}
.pill{border:1px solid rgba(255,255,255,.25);border-radius:999px;padding:7px 14px;font-size:12px;font-weight:700}
.tag{display:inline-block;background:rgba(143,107,255,.16);border:1px solid rgba(143,107,255,.5);
 color:#c9b6ff;border-radius:999px;padding:5px 13px;font-size:11.5px;font-weight:700;letter-spacing:.1em;margin:42px 0 16px}
h1{font-size:42px;line-height:1.26;font-weight:700;letter-spacing:-.03em}
h1 span{background:linear-gradient(92deg,#8f6bff,#26c4b7);-webkit-background-clip:text;background-clip:text;color:transparent}
.sub{margin-top:14px;font-size:14px;line-height:1.75;color:rgba(242,244,250,.6)}
.glass{margin-top:30px;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.14);
 border-radius:22px;padding:22px;backdrop-filter:blur(10px);display:flex;gap:20px;align-items:center}
.ring{width:96px;height:96px;border-radius:50%;flex:none;
 background:conic-gradient(#8f6bff 0 74%, rgba(255,255,255,.12) 74% 100%);
 display:flex;align-items:center;justify-content:center;position:relative}
.ring::before{content:"";position:absolute;inset:10px;background:#151827;border-radius:50%}
.ring b{position:relative;font-size:21px;letter-spacing:-.02em}
.ring b i{font-style:normal;font-size:12px;color:#8f6bff}
.gtxt .l{font-size:11.5px;letter-spacing:.12em;font-weight:700;color:rgba(242,244,250,.55)}
.gtxt .v{font-size:17px;font-weight:700;margin-top:4px;line-height:1.5}
.gtxt .v em{font-style:normal;color:#26c4b7}
.row2{display:flex;gap:12px;margin-top:14px}
.stat{flex:1;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.12);border-radius:18px;padding:16px}
.stat .l{font-size:11px;font-weight:700;letter-spacing:.12em;color:rgba(242,244,250,.5)}
.stat .n{font-size:26px;font-weight:700;margin-top:6px;letter-spacing:-.02em}
.stat .n i{font-style:normal;font-size:13px;color:#8f6bff}
.cta{position:absolute;left:24px;right:24px;bottom:30px;background:linear-gradient(92deg,#8f6bff,#6338ee);
 border-radius:16px;padding:17px;text-align:center;font-size:15.5px;font-weight:700;color:#fff;
 box-shadow:0 12px 34px rgba(99,56,238,.45)}
.ghost{position:absolute;left:24px;right:24px;bottom:96px;border:1px solid rgba(255,255,255,.22);
 border-radius:16px;padding:15px;text-align:center;font-size:14px;font-weight:700;color:rgba(242,244,250,.85)}
</style></head><body>
<div class="aurora"></div>
<div class="wrap">
 <div class="nav"><div class="logo">LU<b>M</b>EN</div><div class="pill">문의</div></div>
 <span class="tag">PERSONAL TRAINING STUDIO</span>
 <h1>운동은 감이 아니라<br><span>데이터</span>로<br>완성됩니다</h1>
 <p class="sub">체형 분석부터 회복 관리까지,<br>기록이 남는 1:1 트레이닝.</p>
 <div class="glass">
  <div class="ring"><b>74<i>%</i></b></div>
  <div class="gtxt"><div class="l">THIS MONTH</div>
   <div class="v">목표 달성률<br><em>+12%</em> 지난달 대비</div></div>
 </div>
 <div class="row2">
  <div class="stat"><div class="l">MEMBERS</div><div class="n">312<i>명</i></div></div>
  <div class="stat"><div class="l">RETENTION</div><div class="n">91<i>%</i></div></div>
 </div>
 <div class="ghost">프로그램 살펴보기</div>
 <div class="cta">무료 체형 분석 예약 →</div>
</div>
</body></html>
