<!doctype html><html lang="ko"><head><meta charset="utf-8">
<meta name="viewport" content="width=390, initial-scale=1">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;700&family=Noto+Serif+KR:wght@600;700&display=swap">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{width:390px;height:844px;overflow:hidden;background:#f5f2ea;color:#1c241f;
 font-family:"IBM Plex Sans KR",sans-serif;position:relative}
.nav{display:flex;justify-content:space-between;align-items:center;padding:20px 24px 0;position:relative;z-index:3}
.logo{font-family:"Noto Serif KR",serif;font-weight:700;font-size:19px;letter-spacing:.04em}
.logo i{font-style:normal;color:#5f7d3e}
.burger{width:32px;height:32px;border:1.5px solid #1c241f;border-radius:50%;display:flex;flex-direction:column;gap:4px;align-items:center;justify-content:center}
.burger s{display:block;width:13px;height:1.5px;background:#1c241f}
.hero{padding:26px 24px 0;position:relative;z-index:3}
.tag{display:inline-block;border:1.5px solid #1c241f;border-radius:999px;padding:4px 13px;font-size:11px;font-weight:700;letter-spacing:.12em;margin-bottom:14px;background:#f5f2ea}
h1{font-family:"Noto Serif KR",serif;font-size:33px;line-height:1.34;font-weight:700;white-space:nowrap}
h1 em{font-style:normal;color:#31543f;position:relative}
h1 em::after{content:"";position:absolute;left:0;right:0;bottom:5px;height:9px;background:#d8f26e;z-index:-1}
.sub{margin-top:10px;font-size:13.5px;line-height:1.7;color:#5a6156}

/* 아치 비주얼 — 레이어드 보태니컬 */
.arch{margin:20px 24px 0;height:330px;border-radius:170px 170px 24px 24px;position:relative;overflow:hidden}
.arch img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:60% 40%}.arch::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(28,36,31,0) 62%,rgba(28,36,31,.38) 100%)}

.badge{position:absolute;left:16px;bottom:16px;background:rgba(255,255,255,.86);backdrop-filter:blur(4px);
 border-radius:999px;padding:9px 16px;font-size:12px;font-weight:700;display:flex;gap:8px;align-items:center;z-index:2}
.badge i{font-style:normal;width:8px;height:8px;border-radius:50%;background:#5f7d3e;display:inline-block}
.cta{position:absolute;right:16px;bottom:16px;z-index:2;width:56px;height:56px;border-radius:50%;
 background:#1c241f;color:#d8f26e;display:flex;align-items:center;justify-content:center;font-size:22px;font-weight:700;
 box-shadow:0 10px 24px rgba(28,36,31,.35)}

.row{display:flex;gap:12px;padding:16px 24px 0}
.cell{flex:1;border-radius:20px;padding:16px 18px}
.g{background:#1e3a2f;color:#eef3e4}
.g .n{font-family:"Noto Serif KR",serif;font-size:34px;font-weight:700;line-height:1.1;margin-top:4px}
.g .n span{font-size:15px}
.l{background:#d8f26e;color:#1c241f}
.l .b{font-size:19px;font-weight:700;line-height:1.35;margin-top:4px}
.lab{font-size:10.5px;font-weight:700;letter-spacing:.13em;opacity:.8}
.marq{position:absolute;bottom:0;left:0;right:0;background:#1c241f;color:#f5f2ea;
 padding:13px 0;font-size:12px;letter-spacing:.14em;font-weight:700;white-space:nowrap;overflow:hidden}
.marq div{display:inline-block;padding-left:10px}
.marq i{font-style:normal;color:#d8f26e;margin:0 13px}
</style></head><body>
<div class="nav"><div class="logo">MOSS<i>·</i>ATELIER</div><div class="burger"><s></s><s></s><s></s></div></div>
<div class="hero">
 <span class="tag">SINCE 2021 · 부산</span>
 <h1>식물이 <em>머무는 자리</em>를<br>설계합니다</h1>
 <p class="sub">수종 선택부터 정기 관리까지, 플랜테리어의 처음과 끝.</p>
</div>

<div class="arch">
 <img src="plant.jpg" alt="">
 <span class="badge"><i></i>공간 시공 128곳</span>
 <span class="cta">→</span>
</div>

<div class="row">
 <div class="cell g"><span class="lab">PROJECTS</span><div class="n">128<span>곳</span></div></div>
 <div class="cell l"><span class="lab">CARE</span><div class="b">월 1회<br>정기 관리</div></div>
</div>
<div class="marq"><div>MOSS ATELIER <i>✦</i> PLANT &amp; SPACE <i>✦</i> BUSAN <i>✦</i> MOSS ATELIER <i>✦</i> PLANT &amp; SPACE <i>✦</i> BUSAN <i>✦</i></div></div>
</body></html>
