  <rect x="180" y="480" width="840" height="2" fill="#DDE1E7"/>
  <rect x="240" y="250" width="420" height="280" rx="10" fill="#FFFFFF" stroke="#C7CDD6"/>
  <rect x="300" y="310" width="220" height="16" rx="4" fill="#DDE1E7"/>
  <rect x="300" y="350" width="300" height="10" rx="4" fill="#E8EBEF"/>
  <rect x="300" y="372" width="260" height="10" rx="4" fill="#E8EBEF"/>
  <rect x="300" y="420" width="120" height="60" rx="6" fill="#F0F2F5" stroke="#DDE1E7"/>
  <rect x="700" y="330" width="280" height="200" rx="6" fill="#FFFFFF" stroke="#DDE1E7" transform="rotate(-3 840 430)"/>
  <rect x="740" y="380" width="180" height="12" rx="4" fill="#DDE1E7" transform="rotate(-3 830 386)"/>
  <rect x="740" y="410" width="200" height="10" rx="4" fill="#E8EBEF" transform="rotate(-3 840 415)"/>
  <circle cx="960" cy="300" r="6" fill="#829487" opacity="0.6"/>
  <circle cx="220" cy="230" r="6" fill="#414965" opacity="0.6"/>
  <text x="600" y="740" text-anchor="middle" font-family="system-ui, sans-serif" font-size="22" fill="#848B97">작업 장면 사진 — 실제 촬영 이미지로 교체 예정</text>
</svg>
