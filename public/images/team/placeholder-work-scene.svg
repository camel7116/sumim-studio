<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-label="작업 장면 사진 플레이스홀더">
  <rect width="1200" height="800" fill="#F0F2F5"/>
